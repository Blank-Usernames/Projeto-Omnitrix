<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix RNG</title>
    <link rel="shortcut icon" href="assets/images/icons/Ben_10_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/laboratory.css" />
    <script type="module" src="js/app.js"></script>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img class="logo-icon" src="assets/images/icons/Ben_10_logo.png"
                alt="Ben 10 Logo">OMNITRIX RNG</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="wiki.html">Wiki</a>
            <a href="roulette.html" data-auth-only>Roleta</a>
            <a href="collection.html" data-auth-only>Coleção</a>
            <a href="laboratory.html" data-auth-only>Laboratório</a>
        </nav>
        <div class="nav-auth">
            <a href="login.html" data-guest-only>Login</a>
            <a href="register.html" data-guest-only>Cadastro</a>
        </div>
    </header>

    <main class="layout">
        <div class="buttons">
            <button class="link-primary" id="Laboratory-create" data-auth-only>Create</button>
            <button class="link-primary" id="Laboratory-display" data-auth-only>Display</button>
        </div>

        <form action="" id="cadastro-alien">
            <section id="section-cadastro">
                <div class="cadastro-container">
                    <div class="input-container">
                        <label for="nomeAlien-input"><h3>Nome do Alien: </h3></label>
                        <input type="text" name="nomeAlien" id="nomeAlien-input" required>
                    </div>

                    <div class="input-container">
                        <label for="descricao-input"><h3>Descrição: </h3></label>
                        <p></p>
                        <textarea name="description" id="desc-input" cols="20" rows="5"></textarea>
                    </div>
                </div>
                <h2>Curiosidades</h2>
            </section>
            <section id="section-cadastro1">
                <div class="cadastro-container">
                    <div class="input-container">
                        <label for="curiosidade1-input"><h3>Curiosidade: </h3></label>
                        <input type="text" name="curiosidade1" id="curiosidade1-input" required>
                    </div>
                    <div class="input-container">
                        <label for="curiosidade2-input"><h3>Curiosidade: </h3></label>
                        <input type="text" name="curiosidade2" id="curiosidade2-input" required>
                    </div>
                    <div class="input-container">
                        <label for="curiosidade3-input"><h3>Curiosidade: </h3></label>
                        <input type="text" name="curiosidade3" id="curiosidade3-input" required>
                    </div>
                    <div class="input-container">
                        <label for="imagem-input"><h3>Imagem do Alien: </h3></label>
                        <input type="text" name="alien-image" id="alien-image-input" required>
                    </div>

                    <div id="cadastro-buttons">
                        <button class="link-primary" type="submit">Criar</button>
                        <button class="link-secondary" type="reset">Limpar</button>
                    </div>
                </div>
            </section>
        </form>
    </main>

    <footer>
        <p>OMNITRIX RNG © 2026 — PROJETO PROGRAMAÇÃO WEB</p>
    </footer>
</body>

</html>
