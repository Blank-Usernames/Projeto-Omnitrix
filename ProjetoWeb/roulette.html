<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix RNG</title>
    <link rel="shortcut icon" href="assets/logo/Ben_10_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/roulette.css" />
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/roulette.js"></script>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img class="logo-icon" src="assets/logo/Ben_10_logo.png"
                alt="Ben 10 Logo">OMNITRIX RNG</a>
        <nav>
            <a href="index.html" data-auth-only>Home</a>
            <a href="roulette.html" data-auth-only>Roleta</a>
            <a href="collection.html" data-auth-only>Coleção</a>
            <a href="laboratory.html" data-auth-only>Laboratório</a>
        </nav>
        <div class="nav-auth">
            <a href="login.html" data-guest-only>Login</a>
            <a href="register.html" data-guest-only>Cadastro</a>
            <a href="#" id="logout-link" data-auth-only>Logout</a>
        </div>
    </header>

    <main class="container-roleta">
        <section class="titulo-roleta">
            <span>OMNITRIX RNG</span>
            <h1>GIRE O <span>OMNITRIX</span></h1>
            <p>APERTE O BOTÃO PARA OBTER UM NOVO ALIEN ALEATÓRIO.</p>
        </section>

        <!-- OMNITRIX -->
        <section class="palco-omnitrix" id="palco-omnitrix">
            <div class="anel-omnitrix"></div>

            <div class="caixa-omnitrix">
                <img class="imagem-omnitrix" src="assets/images/icons/Ben_10_Omnitrix_Roleta.png" alt="Omnitrix">

                <!-- VISOR DO OMNITRIX: onde os aliens passam durante o giro -->
                <div class="visor-omnitrix" id="visor-omnitrix">
                    <img id="img-visor" src="" alt="" hidden>
                </div>
            </div>
        </section>

        <button class="btn-secondary" id="botao-girar" type="button">GIRAR</button>

        <!-- RESULTADO -->
        <section class="resultado-roleta" id="resultado-roleta" aria-live="polite" hidden>
            <img id="img-resultado" src="" alt="">
            <div class="info-resultado">
                <span class="tag-resultado" id="tag-resultado"></span>
                <h2 id="nome-resultado"></h2>
                <p>Raridade: <span id="raridade-resultado"></span></p>
                <p id="mensagem-resultado"></p>
                <a class="link-secondary" href="collection.html">VER COLEÇÃO</a>
            </div>
        </section>
       
        <section class="estatisticas-roleta">
            <h2>PROBABILIDADES</h2>
            <p>TOTAL DE GIROS: <span id="total-giros">???</span></p>

            <div class="lista-raridades">
                <div class="linha-raridade">
                    <span class="raridade-texto" style="color: var(--primary);">COMUM</span><span>50%</span>
                </div>
                <div class="raridade-comum"></div>
                <div class="linha-raridade">
                    <span class="raridade-texto" style="color: #4da6ff;">INCOMUM</span><span>30%</span>
                </div>
                <div class="raridade-incomum"></div>
                <div class="linha-raridade">
                    <span class="raridade-texto" style="color: #884dff">RARO</span><span>15%</span>
                </div>
                <div class="raridade-raro"></div>
                <div class="linha-raridade">
                    <span class="raridade-texto" style="color: #ea6010">LENDÁRIO</span><span>5%</span>
                </div>
                <div class="raridade-lendario"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>OMNITRIX RNG © 2026 — PROJETO PROGRAMAÇÃO WEB</p>
    </footer>
</body>

</html>
