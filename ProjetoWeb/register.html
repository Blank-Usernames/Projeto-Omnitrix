<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix RNG</title>
    <link rel="shortcut icon" href="assets/logo/Ben_10_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/register.js"></script>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img class="logo-icon" src="assets/logo/Ben_10_logo.png"
                alt="Ben 10 Logo">OMNITRIX RNG</a>
        <nav>
            <a href="index.html" data-auth-only>Home</a>
            <a href="roulette.html" data-auth-only>Roleta</a>
            <a href="collection.html" data-auth-only>Coleção</a>
            <a href="laboratory.html" data-auth-only>Laboratório</a>
        </nav>
        <div class="nav-auth">
            <a href="login.html" data-guest-only>Login</a>
            <a href="register.html" data-guest-only>Cadastro</a>
            <a href="#" id="logout-link" data-auth-only>Logout</a>
        </div>
    </header>

    <div class="register-layout">
        <main class="register-container">
            <form action="">
                <h1>CRIE SUA <span>CONTA</span></h1>

                <p id="register-message"></p>

                <label for="nome-usuario">Nome de Usuário:</label>
                <input type="text" name="nome-usuario" id="nome-usuario">

                <label for="email-usuario">E-mail:</label>
                <input type="email" name="email-usuario" id="email-usuario">
                
                <label for="senha-usuario">Senha:</label>
                <input type="password" name="senha-usuario" id="senha-usuario">
                

                <label for="confirmar-senha">Confirme a Senha:</label>
                <input type="password" name="confirmar-senha" id="confirmar-senha">

                <div class="button-forms">
                    <button class="btn-primary" type="submit">CADASTRAR</button>
                    <button class="btn-secondary" type="reset">LIMPAR</button>
                </div>
            </form>
        </main>

        <div class="hero-image">
            <img src="assets/images/backgrounds/ben-register.png" alt="Omnitrix">
            <p>
                <span>ACESSE SUA CONTA</span> E OBTENHA TODOS OS ALIENS.<br> TORNE-SE O PORTADOR DA ARMA MAIS PODEROSA
                DO
                <span>
                    UNIVERSO...
                </span>
            </p>
            <a class="link-secondary" href="login.html">JÁ POSSUO UMA CONTA →</a>
        </div>
    </div>

    <footer>
        <p>OMNITRIX RNG © 2026 — PROJETO PROGRAMAÇÃO WEB</p>
    </footer>
</body>

</html>
