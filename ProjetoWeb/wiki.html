<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="shortcut icon" href="assets/logo/Ben_10_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/wiki-personal.js"></script>

<body>
    <header class="navbar">
        <a href="index.html" class="logo"><img class="logo-icon" src="assets/logo/Ben_10_logo.png"
                alt="Ben 10 Logo">OMNITRIX RNG</a>
        <nav>
            <a href="index.html" data-auth-only>Home</a>
            <a href="roulette.html" data-auth-only>Roleta</a>

            <a href="laboratory.html" data-auth-only>Laboratório</a>

        <div class="nav-auth">

            <a href="#" id="logout-link" data-auth-only>Logout</a>

    <main class="wiki-container">
        <!-- Caixa da Esquerda -->
        <div class="infobox">

            <h2 class="infobox-title" id="alien-info-name"></h2>
            <ul class="infobox-details">
                <li><strong>Espécie:</strong> <span id="alien-species"></span></li>

                <li><strong>Elemento:</strong> <span id="alien-element"></span></li>
                <li><strong>Tipo:</strong> <span id="alien-type"></span></li>
            </ul>
        </div>

        <!-- Caixa da Direita -->
        <div class="wiki-content">
            <a href="laboratory.html" class="btn-back">← Voltar para o Laboratório</a>
            <h1 id="alien-name"></h1>
            <p id="alien-phrase"></p>

            <h2>Visão Geral</h2>
            <p id="alien-description"></p>

            <h2>Habilidades e Poderes</h2>
            <p id="alien-powers"></p>
        </div>

    <footer>
        <p>OMNITRIX RNG © 2026 — PROJETO PROGRAMAÇÃO WEB</p>
